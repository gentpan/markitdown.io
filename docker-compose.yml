services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: makeitdown
      POSTGRES_PASSWORD: makeitdown
      POSTGRES_DB: makeitdown
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makeitdown -d makeitdown"]
      interval: 5s
      timeout: 5s
      retries: 10

  convert:
    build:
      context: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:3000,http://localhost:3001,http://127.0.0.1:3000,http://127.0.0.1:3001
      MAX_FILE_SIZE_MB: 50
    volumes:
      - ./backend/data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health')",
        ]
      interval: 20s
      timeout: 10s
      retries: 5

volumes:
  pgdata:
